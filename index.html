<!doctype html>
<!--
  `es-VE` y no `es` a secas.

  No es cosmético: el navegador usa este atributo para decidir en qué idioma
  escribe lo suyo, que es lo único de la pantalla que no controlamos. Con `es`
  genérico, el selector de fecha nativo y los mensajes de validación salían en
  el idioma del navegador —en inglés en varios equipos de la oficina—, y el
  calendario abría la semana en domingo. Con `es-VE` sale todo en castellano y
  con las convenciones de aquí.
-->
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <!--
      El icono de la pestaña.

      Era un cubo azul dibujado a mano, del tema anterior y sin parecido con el
      logo de la empresa. Ahora es la insignia real, recortada y centrada en un
      cuadrado: un favicon no es rectangular, y estirarla la deformaría.

      Tres tamaños porque cada sitio pide el suyo: 32 para la pestaña, 180 para
      cuando alguien la ancla en la pantalla de inicio de un iPhone, y 192 para
      Android. Van cuantizados a 128 colores — a ese tamaño no se distingue el
      degradado completo y pesan la mitad.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema de control interno para la explotacion y comercializacion de agregados."
    />
    <title>Minería Internacional TS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
